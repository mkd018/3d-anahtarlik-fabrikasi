<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Parametrik Anahtarlık Fabrikası</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 480px; box-sizing: border-box; }
        h2 { color: #333; margin-top: 0; text-align: center; font-size: 20px; }
        .form-group { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: 600; color: #555; font-size: 14px; }
        input[type="text"], input[type="number"], select { width: 200px; padding: 6px 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; text-align: right; }
        select { text-align-last: right; cursor: pointer; }
        .full-width { width: 100%; display: block; margin-bottom: 8px; }
        #canvas-container { width: 100%; height: 240px; background: #e9ecef; border-radius: 8px; margin: 15px 0; position: relative; overflow: hidden; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        button { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }
        .status { font-size: 12px; color: #28a745; text-align: center; font-weight: bold; margin-bottom: 10px; padding: 6px; border-radius: 4px; }
        .status.error { color: #dc3545; background: #f8d7da; }
        .status.loading { color: #856404; background: #fff3cd; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔑 3D Anahtarlık Fabrikası</h2>
    
    <div class="form-group full-width" style="flex-direction: column; align-items: flex-start;">
        <label for="textInput">Anahtarlık Metni:</label>
        <input type="text" id="textInput" value="DOĞAN" oninput="updateKeychain()" style="width: 100%; text-align: left; margin-top: 5px; padding: 8px;" placeholder="Türkçe karakter: ÇĞİÖŞÜ">
    </div>

    <div class="form-group">
        <label for="fontSelect">Yazı Tipi:</label>
        <select id="fontSelect" onchange="changeFont()">
            <option value="Open_Sans_Regular.json">Open Sans - Normal</option>
            <option value="Open_Sans_Italic.json">Open Sans - İtalik</option>
            <option value="Roboto_Regular.json">Roboto - Normal</option>
            <option value="Roboto_Italic.json">Roboto - İtalik</option>
        </select>
    </div>

    <div id="status" class="status loading">Font yükleniyor...</div>

    <hr>

    <div class="form-group">
        <label for="widthInput">Genişlik (X - mm):</label>
        <input type="number" id="widthInput" value="100" min="40" max="200" oninput="updateKeychain()">
    </div>
    <div class="form-group">
        <label for="heightInput">Yükseklik (Y - mm):</label>
        <input type="number" id="heightInput" value="30" min="20" max="80" oninput="updateKeychain()">
    </div>
    <div class="form-group">
        <label for="thicknessInput">Toplam Kalınlık (Z - mm):</label>
        <input type="number" id="thicknessInput" value="3.5" min="1" max="10" step="0.5" oninput="updateKeychain()">
    </div>
    <div class="form-group">
        <label for="holeInput">Delik Çapı (mm):</label>
        <input type="number" id="holeInput" value="4.5" min="2" max="10" step="0.5" oninput="updateKeychain()">
    </div>
    <div class="form-group">
        <label for="radiusInput">Kenar Yuvarlama (Radius):</label>
        <input type="number" id="radiusInput" value="4" min="0" max="15" step="0.5" oninput="updateKeychain()">
    </div>

    <div id="canvas-container"></div>

    <button id="downloadBtn" onclick="downloadSTL()">STL İndir</button>
</div>

<script>
    let scene, camera, renderer, controls, keychainGroup, loadedFont = null;

    // Kabartma payı - yazı plakanın içinden sadece bu kadar dışarı çıkar
    const KABARTMA_PAYI = 0.4;

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe9ecef);

        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, -110, 70);
        camera.up.set(0, 0, 1);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, -20, 40);
        scene.add(dirLight);

        // İlk fontu yükle
        const defaultFont = document.getElementById('fontSelect').value;
        loadFont(defaultFont);
        animate();
    }

    function loadFont(fontFileName) {
        const statusEl = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');
        
        statusEl.innerText = "Font yükleniyor...";
        statusEl.className = "status loading";
        downloadBtn.disabled = true;

        const loader = new THREE.FontLoader();
        loader.load(
            fontFileName,
            function (font) {
                loadedFont = font;
                statusEl.innerText = `✅ ${fontFileName.replace('.json', '')} yüklendi - Türkçe karakterler aktif`;
                statusEl.className = "status";
                downloadBtn.disabled = false;
                updateKeychain();
            },
            undefined,
            function (error) {
                console.error("Font yüklenemedi:", fontFileName, error);
                statusEl.innerText = `❌ ${fontFileName} yüklenemedi!`;
                statusEl.className = "status error";
            }
        );
    }

    function changeFont() {
        const selectedFont = document.getElementById('fontSelect').value;
        loadFont(selectedFont);
    }

    function createRoundedRectShape(width, height, radius) {
        const shape = new THREE.Shape();
        const x = -width / 2;
        const y = -height / 2;
        radius = Math.min(radius, width / 2, height / 2);

        shape.moveTo(x, y + radius);
        shape.lineTo(x, y + height - radius);
        shape.quadraticCurveTo(x, y + height, x + radius, y + height);
        shape.lineTo(x + width - radius, y + height);
        shape.quadraticCurveTo(x + width, y + height, x + width, y + height - radius);
        shape.lineTo(x + width, y + radius);
        shape.quadraticCurveTo(x + width, y, x + width - radius, y);
        shape.lineTo(x + radius, y);
        shape.quadraticCurveTo(x, y, x, y + radius);
        
        return shape;
    }

    function updateKeychain() {
        if (!scene || !loadedFont) return;
        if (keychainGroup) scene.remove(keychainGroup);

        keychainGroup = new THREE.Group();
        const material = new THREE.MeshStandardMaterial({ color: 0x00a8cc, roughness: 0.3 });
        const textMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });

        const width = parseFloat(document.getElementById('widthInput').value) || 100;
        const height = parseFloat(document.getElementById('heightInput').value) || 30;
        const thickness = parseFloat(document.getElementById('thicknessInput').value) || 3.5;
        const holeDia = parseFloat(document.getElementById('holeInput').value) || 4.5;
        const radius = parseFloat(document.getElementById('radiusInput').value) || 4;
        const textVal = document.getElementById('textInput').value || "DOĞAN";

        const holeX = (width / 2) - 2 - (holeDia / 2);
        const holeY = 0;

        // ============================================
        // PLAKA
        // ============================================
        const rectShape = createRoundedRectShape(width, height, radius);
        const holePath = new THREE.Path();
        holePath.absarc(holeX, holeY, holeDia / 2, 0, Math.PI * 2, true);
        rectShape.holes.push(holePath);

        const extrudeSettings = { 
            depth: thickness, 
            bevelEnabled: true, 
            bevelSegments: 2, 
            steps: 1, 
            bevelSize: 0.15, 
            bevelThickness: 0.15 
        };
        const plateGeo = new THREE.ExtrudeGeometry(rectShape, extrudeSettings);
        plateGeo.center();
        const plateMesh = new THREE.Mesh(plateGeo, material);
        plateMesh.position.set(0, 0, thickness / 2);
        keychainGroup.add(plateMesh);

        // ============================================
        // YAZI - Plakanın içine gömülü, Türkçe karakter payı ile
        // ============================================
        if (textVal.trim() !== "") {
            // Yazı boyutu plaka yüksekliğinin %45'i (Türkçe karakterlerin uzantıları için pay)
            let fontSize = height * 0.45;

            const leftBoundary = -width / 2 + 2;
            const holeLeftBoundary = holeX - (holeDia / 2) - 3;
            const maxTextWidth = holeLeftBoundary - leftBoundary;

            const textDepth = KABARTMA_PAYI;
            
            let textGeo;
            try {
                textGeo = new THREE.TextGeometry(textVal, {
                    font: loadedFont,
                    size: fontSize,
                    height: textDepth,
                    curveSegments: 12
                });
            } catch(e) {
                console.warn("Metin oluşturulamadı:", e);
                const safeText = textVal
                    .replace(/Ç/g, 'C').replace(/ç/g, 'c')
                    .replace(/Ğ/g, 'G').replace(/ğ/g, 'g')
                    .replace(/İ/g, 'I').replace(/ı/g, 'i')
                    .replace(/Ö/g, 'O').replace(/ö/g, 'o')
                    .replace(/Ş/g, 'S').replace(/ş/g, 's')
                    .replace(/Ü/g, 'U').replace(/ü/g, 'u');
                textGeo = new THREE.TextGeometry(safeText, {
                    font: loadedFont,
                    size: fontSize,
                    height: textDepth,
                    curveSegments: 12
                });
            }
            
            textGeo.computeBoundingBox();
            let textWidth = textGeo.boundingBox.max.x - textGeo.boundingBox.min.x;
            let textHeightActual = textGeo.boundingBox.max.y - textGeo.boundingBox.min.y;

            // Genişlik sığmazsa küçült
            if (textWidth > maxTextWidth && textWidth > 0) {
                const scale = maxTextWidth / textWidth;
                fontSize *= scale;
                textGeo.dispose();
                textGeo = new THREE.TextGeometry(textVal, {
                    font: loadedFont,
                    size: fontSize,
                    height: textDepth,
                    curveSegments: 12
                });
                textGeo.computeBoundingBox();
                textWidth = textGeo.boundingBox.max.x - textGeo.boundingBox.min.x;
                textHeightActual = textGeo.boundingBox.max.y - textGeo.boundingBox.min.y;
            }

            // Yükseklik sığmazsa küçült (Ğ, Ş gibi uzun karakterler için)
            const maxTextHeight = height * 0.65;
            if (textHeightActual > maxTextHeight && textHeightActual > 0) {
                const scale = maxTextHeight / textHeightActual;
                fontSize *= scale;
                textGeo.dispose();
                textGeo = new THREE.TextGeometry(textVal, {
                    font: loadedFont,
                    size: fontSize,
                    height: textDepth,
                    curveSegments: 12
                });
                textGeo.computeBoundingBox();
                textWidth = textGeo.boundingBox.max.x - textGeo.boundingBox.min.x;
            }

            const textMesh = new THREE.Mesh(textGeo, textMaterial);
            
            // Yazıyı plakanın içine göm
            const centerX = leftBoundary + (maxTextWidth - textWidth) / 2;
            const posY = -fontSize / 2.5;
            const textZPos = thickness / 2 - textDepth;
            
            textMesh.position.set(centerX, posY, textZPos);
            keychainGroup.add(textMesh);
        }

        scene.add(keychainGroup);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    function downloadSTL() {
        if (!keychainGroup) {
            alert("Model henüz yüklenmedi!");
            return;
        }

        const exporter = new THREE.STLExporter();
        const result = exporter.parse(keychainGroup, { binary: true });

        const blob = new Blob([result], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        
        const textVal = document.getElementById('textInput').value || "anahtarlik";
        link.download = `${textVal.replace(/[^a-zA-Z0-9]/g, '_')}_anahtarlik.stl`;
        link.click();
    }

    window.onload = init3D;
</script>

</body>
</html>
